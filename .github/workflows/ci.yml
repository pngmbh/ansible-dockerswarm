---
name: ci

on:
  pull_request

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          # this should be in sync with our deploy image
          python-version: "3.7.x"
      - run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions
      - run: tox
